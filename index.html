<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piano Composer Pro</title>

<link rel="stylesheet" href="styles.css">

</head>
<body>

<header>

    <div class="topBar">

        <div class="titleBlock">

            <h1>🎹 Piano Composer Pro</h1>

            <div class="signature">
                ✨ ByDélé
            </div>

        </div>

        <div class="playerStatus">

            <h3 id="playerLevel">
                🎖 Niveau 1
            </h3>

            <div class="headerXpBar">

                <div id="headerXpFill"></div>

            </div>

            <p id="headerXpText">

                0 / 500 XP

            </p>

        </div>

    </div>

    <div class="controls">

        <button id="connectMidi">

            Connexion MIDI
            

        </button>

        <button onclick="toggleFullscreen()">
            🎹 Plein écran
        </button>

        

        <label>

            Tempo

        </label>

        <input
            type="range"
            id="tempo"
            min="20"
            max="300"
            value="120"
        >

        <span id="tempoValue">

            120 BPM

        </span>

    </div>

</header>

<section class="lesson">
    <h2>Progression active</h2>

    <div id="progression">
        <span class="chord active">C</span>
        <span class="chord">G</span>
        <span class="chord">Am</span>
        <span class="chord">F</span>
    </div>
</section>

<div id="pianoWrapper">

    <div id="keyboard"></div>

</div>
<div id="midiStatus">
    Aucun périphérique MIDI connecté
</div>

<div id="infoPanel">

    <h2 id="currentNote">
        Note : -
    </h2>

    <h2 id="detectedChord">
        Accord : -
    </h2>

    <h2 id="suggestedScale">
        Gamme : -
    </h2>

    <h3 id="noteCounter">
        Notes jouées : 0
    </h3>

</div>

<div id="history">

    <h2>Historique</h2>

    <ul id="historyList"></ul>

</div>

<script src="piano.js"></script>
<script src="app.js"></script>

</body>
</html>
